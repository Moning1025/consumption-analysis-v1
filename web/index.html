<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多源数据融合的本地消费分析系统 V1.0</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        html, body { height: 100%; }

        /* ============ 登录页 ============ */
        #loginView {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0b1f3a 0%, #123c5f 48%, #0e7490 100%);
            overflow: hidden;
        }
        #loginView::before, #loginView::after {
            content: ""; position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.06); pointer-events: none;
        }
        #loginView::before { width: 520px; height: 520px; top: -180px; right: -120px; }
        #loginView::after { width: 380px; height: 380px; bottom: -140px; left: -100px; }

        .login-card {
            position: relative; width: 400px; background: #fff; border-radius: 18px;
            padding: 42px 40px 34px; box-shadow: 0 24px 64px rgba(2, 18, 36, 0.45);
            animation: cardIn .45s ease;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

        .login-brand { text-align: center; margin-bottom: 30px; }
        .login-brand h1 { font-size: 20px; color: #0f2b46; font-weight: 600; letter-spacing: .5px; }
        .login-brand .badge {
            display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 999px;
            background: linear-gradient(135deg, #0e7490, #0891b2); color: #fff;
            font-size: 12px; letter-spacing: 1px;
        }

        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; color: #334155; margin-bottom: 6px; }
        .input-wrap {
            display: flex; align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0;
            border-radius: 10px; padding: 0 14px; transition: border-color .2s, box-shadow .2s;
        }
        .input-wrap:focus-within { border-color: #0e7490; box-shadow: 0 0 0 3px rgba(14, 116, 144, .12); background: #fff; }
        .input-wrap svg { flex: none; width: 18px; height: 18px; fill: #94a3b8; margin-right: 10px; }
        .input-wrap input {
            flex: 1; border: none; outline: none; background: transparent;
            height: 46px; font-size: 14px; color: #0f172a;
        }
        .input-wrap input::placeholder { color: #94a3b8; }

        .login-options { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 22px; font-size: 13px; }
        .login-options a { color: #0e7490; text-decoration: none; cursor: pointer; }
        .login-options a:hover { text-decoration: underline; }

        .btn-primary {
            width: 100%; height: 46px; border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, #0e7490, #0891b2); color: #fff;
            font-size: 15px; letter-spacing: 4px; transition: filter .2s, transform .1s;
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:active { transform: scale(.98); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

        .login-error {
            display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px;
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 13px;
        }
        .login-error.show { display: block; }

        /* ============ 主界面 ============ */
        #mainView { display: none; height: 100vh; }
        #mainView.active { display: flex; flex-direction: column; }

        .topbar {
            height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between;
            padding: 0 22px; background: #0f172a; color: #e2e8f0;
        }
        .topbar .title { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
        .topbar .title small { font-size: 12px; color: #38bdf8; margin-left: 8px; }
        .topbar .userbox { display: flex; align-items: center; gap: 14px; font-size: 13px; }
        .topbar .userbox .who { color: #94a3b8; }
        .topbar .userbox .who b { color: #e2e8f0; font-weight: 600; }
        .btn-logout {
            border: 1px solid #334155; background: transparent; color: #e2e8f0;
            padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .btn-logout:hover { background: #1e293b; }

        .shell { flex: 1; display: flex; min-height: 0; }
        .sidebar {
            width: 220px; flex: none; background: #0f172a; color: #94a3b8;
            padding: 14px 10px; overflow-y: auto;
        }
        .sidebar .menu-group { font-size: 12px; color: #475569; padding: 10px 12px 6px; letter-spacing: 1px; }
        .sidebar .menu-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 2px;
            border-radius: 8px; cursor: pointer; font-size: 14px; transition: background .15s, color .15s;
        }
        .sidebar .menu-item:hover { background: #1e293b; color: #e2e8f0; }
        .sidebar .menu-item.active { background: #0e7490; color: #fff; }
        .sidebar .menu-item .tag { margin-left: auto; font-size: 11px; color: #38bdf8; }

        .main-content { flex: 1; background: #f1f5f9; padding: 24px; overflow-y: auto; }
        .panel {
            background: #fff; border-radius: 12px; padding: 22px 24px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, .05); margin-bottom: 20px;
        }
        .panel h2 { font-size: 17px; color: #0f172a; margin-bottom: 6px; }
        .panel .sub { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .panel .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-ghost {
            border: 1px solid #cbd5e1; background: #fff; color: #0e7490;
            padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 14px;
        }
        .btn-ghost:hover { border-color: #0e7490; background: #f0f9fb; }
        .log-box {
            margin-top: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 14px 16px; font-family: Consolas, monospace; font-size: 13px;
            min-height: 60px; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all;
            color: #1e293b; line-height: 1.7;
        }
        .log-line { padding: 2px 0; }
        .log-line .ts { color: #94a3b8; margin-right: 6px; }
        .log-line.INFO { color: #0f172a; }
        .log-line.INFO::before { content: "ℹ️ "; }
        .log-line.WARN { color: #b45309; background: #fef3c7; border-radius: 4px; padding: 1px 6px; display: inline-block; }
        .log-line.ERROR { color: #b91c1c; background: #fee2e2; border-radius: 4px; padding: 1px 6px; display: inline-block; }
        .welcome-banner {
            background: linear-gradient(135deg, #0e7490, #0f2b46); color: #fff; border-radius: 12px;
            padding: 26px 28px; margin-bottom: 20px;
        }
        .welcome-banner h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .welcome-banner p { font-size: 14px; color: #a7e3f2; }
        .welcome-banner p b { color: #fff; }
        .placeholder { color: #64748b; text-align: center; padding: 70px 20px; }
        .placeholder .big { font-size: 40px; margin-bottom: 12px; }

        /* ============ 表格 / KPI / 进度条 / 表单 ============ */
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
        .kpi { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 4px 18px rgba(15, 23, 42, .05); }
        .kpi .num { font-size: 24px; font-weight: 700; color: #0f172a; }
        .kpi .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { background: #f8fafc; color: #475569; text-align: left; padding: 9px 12px; border-bottom: 1px solid #e2e8f0; font-weight: 600; }
        .data-table td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; color: #0f172a; }
        .data-table tr:hover td { background: #f8fafc; }
        .cf-name { font-weight: 600; color: #0f172a; }
        .cf-src { font-size: 12px; color: #64748b; margin-top: 2px; }
        .stage-item { margin-bottom: 14px; }
        .cf-scroll { max-height: 360px; overflow-y: auto; }
        .cf-scroll thead th { position: sticky; top: 0; background: #f8fafc; z-index: 1; }
        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
        .status-badge.pending, .status-badge.queued { background: #fef3c7; color: #b45309; }
        .status-badge.running { background: #cffafe; color: #0e7490; }
        .status-badge.paused { background: #e2e8f0; color: #475569; }
        .panel-btns { display: flex; gap: 8px; position: relative; z-index: 2; }
        .status-badge.processing { background: #dbeafe; color: #1d4ed8; }
        .status-badge.checking { background: #fef3c7; color: #b45309; }
        .status-badge.completed, .status-badge.active, .status-badge.succeeded { background: #dcfce7; color: #15803d; }
        .status-badge.failed { background: #fee2e2; color: #b91c1c; }
        .progress-wrap { background: #e2e8f0; border-radius: 999px; height: 8px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #0e7490, #0891b2); transition: width .4s; }
        .job-panel { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; background: #f8fafc; }
        .job-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .job-meta { font-size: 12px; color: #475569; margin: 8px 0; }
        .job-log { max-height: 150px; overflow: auto; background: #0f172a; color: #cbd5e1; border-radius: 8px; padding: 10px; font-size: 12px; font-family: Consolas, monospace; margin: 0; white-space: pre-wrap; }
        .mini-form { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 16px; }
        .mini-form.two-col { grid-template-columns: 1fr 1fr; }
        .modal-wide { width: 560px; }
        .mini-form label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
        .mini-form input, .mini-form select { width: 100%; height: 36px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 10px; font-size: 13px; outline: none; background: #fff; }
        .mini-form input:focus, .mini-form select:focus { border-color: #0e7490; box-shadow: 0 0 0 3px rgba(14, 116, 144, .1); }
        .import-btns { display: flex; gap: 12px; flex-wrap: wrap; }
        .ing-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 16px; margin-bottom: 20px; }
        .ing-left { display: flex; flex-direction: column; gap: 16px; }
        .ing-grid > .panel:last-child { display: flex; flex-direction: column; }
        .batch-cards { max-height: 360px; min-height: 0; overflow-y: auto; padding-right: 4px; }
        .panel-head { display: flex; justify-content: space-between; align-items: center; }
        .panel-head h2 { margin: 0 0 4px; }
        .import-choose { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .import-drop { border: 2px dashed #b8c4d4; border-radius: 12px; padding: 18px; text-align: center; background: #f8fafc; margin: 14px 0; transition: all .15s; }
        .import-drop.drag-over { border-color: #0891b2; background: #ecfeff; box-shadow: 0 0 0 4px rgba(8,145,178,.12); }
        .drop-hint { color: #64748b; font-size: 13px; margin-bottom: 0; }
        .block-title { font-size: 14px; font-weight: 600; color: #0f172a; margin: 14px 0 8px; }
        .recent-list { max-height: 210px; overflow-y: auto; padding-right: 4px; }
        .recent-item { display: flex; justify-content: space-between; padding: 7px 10px; font-size: 13px; color: #334155; border-bottom: 1px solid #f1f5f9; }
        .recent-item:last-child { border-bottom: none; }
        .bc-time { color: #94a3b8; font-size: 12px; }
        .list-actions { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 12px; }
        .batch-card { display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
        .bc-check { display: flex; align-items: center; margin-right: 12px; cursor: pointer; flex: none; }
        .bc-check input { width: 16px; height: 16px; accent-color: #0e7490; cursor: pointer; }
        .batch-card:hover { border-color: #0e7490; box-shadow: 0 2px 8px rgba(14, 116, 144, .08); }
        .bc-name { font-size: 14px; font-weight: 600; color: #0f172a; }
        .bc-sub { font-size: 12px; color: #64748b; margin: 3px 0; }
        .bc-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .bc-pct { color: #0e7490; font-weight: 600; }
        .bc-actions { display: flex; flex-direction: column; gap: 6px; flex: none; min-width: 70px; align-items: flex-end; }
        .bc-actions .btn-link { white-space: nowrap; font-size: 13px; }
        #ingProgress { max-height: 300px; overflow-y: auto; padding-right: 4px; }
        .prog-item { margin-bottom: 14px; }
        .prog-head { display: flex; justify-content: space-between; font-size: 13px; color: #334155; margin-bottom: 4px; }
        .prog-desc { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .statusbar { display: flex; gap: 24px; align-items: center; background: #f1f5f9; border-radius: 10px; padding: 10px 16px; font-size: 12px; color: #475569; }
        .drawer-overlay, .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .25s; }
        .drawer-overlay.open, .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .drawer { position: absolute; top: 0; right: -420px; width: 400px; height: 100%; background: #fff; box-shadow: -8px 0 30px rgba(15, 23, 42, .18); transition: right .25s; padding: 22px; overflow-y: auto; }
        .drawer-overlay.open .drawer { right: 0; }
        .drv-title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
        .drv-field { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .drv-field span { width: 110px; color: #94a3b8; flex-shrink: 0; }
        .drv-field b { color: #0f172a; font-weight: 500; }
        .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); background: #fff; border-radius: 14px; padding: 24px 26px; width: 440px; box-shadow: 0 20px 60px rgba(15, 23, 42, .25); transition: transform .25s; }
        .modal-overlay.open .modal { transform: translate(-50%, -50%) scale(1); }
        .modal h3 { font-size: 16px; color: #0f172a; margin-bottom: 6px; }
        .modal .m-sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }
        .modal .m-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
        .btn-ghost.danger-ghost { color: #b91c1c; border-color: #fecaca; }
        .btn-ghost.danger-ghost:hover { background: #fef2f2; }
        .btn-link { background: none; border: none; color: #0e7490; font-size: 13px; cursor: pointer; padding: 2px 6px; }
        .btn-link:hover { text-decoration: underline; }
        .btn-link.danger { color: #b91c1c; }

        /* ============ 第4~11章通用组件 ============ */
        .kpi-row.cols3 { grid-template-columns: repeat(3, 1fr); }
        .kpi-row.cols6 { grid-template-columns: repeat(6, 1fr); }
        .kpi .sub2 { font-size: 11px; color: #94a3b8; margin-top: 3px; }
        .kpi .warn { color: #b45309; }
        .chart-box {
            background: linear-gradient(180deg, #f8fafc, #eef4f8); border: 1px solid #e2e8f0;
            border-radius: 10px; padding: 18px; margin-top: 10px;
        }
        .chart-dark {
            background: linear-gradient(180deg, #0b1f3a, #0e2a4d); border-radius: 10px;
            padding: 18px; margin-top: 10px; position: relative; overflow: hidden; min-height: 220px;
        }
        .chart-dark .map-title { color: #7dd3fc; font-size: 13px; margin-bottom: 6px; }
        .chart-dark .map-note { color: #64748b; font-size: 12px; margin-top: 8px; }
        .chart-dark .map-tag { position: absolute; color: #a5f3fc; font-size: 12px; background: rgba(14,116,144,.25); border: 1px solid rgba(125,211,252,.4); border-radius: 6px; padding: 3px 8px; }
        .chart-dark .legend-bar { position: absolute; left: 18px; bottom: 14px; width: 160px; height: 8px; border-radius: 999px; background: linear-gradient(90deg, #0ea5e9, #facc15, #ef4444); }
        .chart-dark .legend-lbl { position: absolute; left: 18px; bottom: 26px; font-size: 11px; color: #64748b; }
        .chart-dark .view-toggle { position: absolute; right: 14px; top: 14px; display: flex; gap: 4px; }
        .chart-dark .view-toggle button { background: rgba(255,255,255,.1); color: #cffafe; border: 1px solid rgba(125,211,252,.3); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
        .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: #334155; }
        .slider-row .lb { width: 130px; flex-shrink: 0; }
        .slider-row input[type=range] { flex: 1; accent-color: #0e7490; }
        .slider-row .val { width: 44px; text-align: right; font-weight: 600; color: #0e7490; }
        .step-bar { display: flex; gap: 0; margin-bottom: 18px; }
        .step-bar .step { flex: 1; text-align: center; position: relative; padding-top: 26px; font-size: 12px; color: #64748b; }
        .step-bar .step::before {
            content: ""; position: absolute; top: 9px; left: 0; right: 0; height: 2px; background: #e2e8f0;
        }
        .step-bar .step::after {
            content: ""; position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
            width: 12px; height: 12px; border-radius: 999px; background: #e2e8f0; border: 2px solid #cbd5e1;
        }
        .step-bar .step.done { color: #15803d; }
        .step-bar .step.done::before { background: #0e7490; }
        .step-bar .step.done::after { background: #0e7490; border-color: #0e7490; }
        .step-bar .step.cur { color: #0e7490; font-weight: 600; }
        .step-bar .step.cur::after { background: #fff; border-color: #0e7490; box-shadow: 0 0 0 4px rgba(14,116,144,.18); }
        .faq-item { border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
        .faq-item .faq-q { padding: 11px 14px; font-size: 13px; color: #0f172a; cursor: pointer; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
        .faq-item .faq-q:hover { background: #f0f9fb; }
        .faq-item .faq-a { padding: 12px 14px; font-size: 12px; color: #475569; line-height: 1.7; display: none; border-top: 1px solid #e2e8f0; }
        .faq-item.open .faq-a { display: block; }
        .lamp-wall { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .lamp-group h4 { font-size: 13px; color: #0f172a; margin-bottom: 8px; }
        .lamp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .lamp-cell { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
        .lamp-cell .nm { color: #334155; margin: 4px 0; }
        .lamp-dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: #16a34a; margin-right: 5px; }
        .lamp-dot.warn { background: #f59e0b; }
        .lamp-txt { color: #15803d; }
        .lamp-txt.warn { color: #b45309; }
        .big-num { font-size: 44px; font-weight: 800; color: #0f172a; text-align: center; letter-spacing: 1px; }
        .big-num small { font-size: 14px; font-weight: 500; color: #64748b; margin-left: 6px; }
        .alert-list-item { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; background: #fff; }
        .alert-list-item .rail { width: 4px; border-radius: 99px; flex-shrink: 0; }
        .alert-list-item .rail.high { background: #ef4444; }
        .alert-list-item .rail.mid { background: #f59e0b; }
        .alert-list-item .rail.low { background: #38bdf8; }
        .alert-list-item .at { flex: 1; }
        .alert-list-item .at .t { font-size: 13px; color: #0f172a; font-weight: 600; }
        .alert-list-item .at .d { font-size: 12px; color: #64748b; margin: 3px 0; line-height: 1.6; }
        .alert-list-item .at .meta { font-size: 11px; color: #94a3b8; }
        .divider-note { font-size: 12px; color: #64748b; background: #f8fafc; border-radius: 8px; padding: 10px 12px; margin-top: 12px; line-height: 1.7; }
        .tag-chip { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: #f0f9fb; color: #0e7490; border: 1px solid #a5e3f2; }
        .tag-chip.warn { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    </style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="loginView">
    <div class="login-card">
        <div class="login-brand">
            <h1>多源数据融合的本地消费分析系统</h1>
            <span class="badge">V1.0</span>
        </div>
        <div class="field">
            <label for="username">账号/编号</label>
            <div class="input-wrap">
                <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.6-8 6v1h16v-1c0-3.4-3.6-6-8-6Z"/></svg>
                <input id="username" type="text" placeholder="请输入用户名" autocomplete="off">
            </div>
        </div>
        <div class="field">

<script>
let token = "";
let currentUser = null;

const ROLE_NAMES = { administrator: "系统管理员", analyst: "数据分析师", consumer: "普通用户", guest: "访客" };

// 侧边栏菜单（对应《用户说明书》11 个章节；done=false 表示该模块尚未接入，点击显示占位）
const MENUS = [
    { key: "welcome",      label: "首页总览",       done: true  },
    { key: "ingestion",    label: "多源数据接入台",  done: true  },
    { key: "cleaning",     label: "清洗融合流水线",  done: true  },
    { key: "sentiment",    label: "评论情感与主题",  done: true  },
    { key: "rfm",          label: "RFM 分层画像",    done: true  },
    { key: "forecast",     label: "预测与异常检测",  done: true  },
    { key: "spatial",      label: "空间热点与分布",  done: true  },
    { key: "recommend",    label: "个性化推荐",      done: true  },
    { key: "apimonitor",   label: "准实时 API 监测", done: true  },
    { key: "dashboard",    label: "可视化大屏",      done: true  },
    { key: "settings",     label: "系统参数设置",    done: true  },
];

function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function tip(msg) {
    alert(msg);
}

/* ---------- 登录 ---------- */
async function doLogin() {
    const name = document.getElementById("username").value.trim();
    const pwd = document.getElementById("password").value;
    const errBox = document.getElementById("loginError");
    errBox.classList.remove("show");
    if (!name || !pwd) {
        errBox.textContent = "请输入账号和密码";
        errBox.classList.add("show");
        return;
    }
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    try {
        const res = await pywebview.api.login(name, pwd, "login");
        if (res && res.success) {
            token = res.token;
            currentUser = res;
            try { localStorage.setItem("lcis_token", token); } catch (e) {}
            enterMain();
        } else {
            errBox.textContent = "账号或密码错误，请重试";
            errBox.classList.add("show");
        }
    } catch (e) {
        errBox.textContent = "登录服务不可用：" + e;
        errBox.classList.add("show");
    } finally {
        btn.disabled = false;
    }
}

/* 回车提交 */
document.addEventListener("keydown", e => {
    if (e.key === "Enter" && document.getElementById("loginView").style.display !== "none") doLogin();
});

/* ---------- 会话恢复 / 过期 ---------- */
function checkSession() {
    let t = "";
    try { t = localStorage.getItem("lcis_token") || ""; } catch (e) {}
    if (!t) return false;
    try {
        const payload = JSON.parse(t.split(".")[0]);
        if (payload.expires_at && payload.expires_at > Math.floor(Date.now() / 1000)) {
            token = t;
            currentUser = { username: payload.login_name, role: payload.role_code };
            enterMain();
            return true;
        }
    } catch (e) {}
    return false;
}

function doLogout() {
    token = "";
    currentUser = null;
    try { localStorage.removeItem("lcis_token"); } catch (e) {}
    document.getElementById("mainView").classList.remove("active");
    document.getElementById("loginView").style.display = "flex";
}

/* ---------- 主界面 ---------- */
function enterMain() {
    document.getElementById("loginView").style.display = "none";
    document.getElementById("mainView").classList.add("active");
    document.getElementById("whoName").textContent = currentUser.username || "-";
    document.getElementById("whoRole").textContent = ROLE_NAMES[currentUser.role] || currentUser.role || "-";
    buildSidebar();
    renderPage("welcome");
}

function buildSidebar() {
    const box = document.getElementById("sidebar");
    box.innerHTML = '<div class="menu-group">系统功能模块</div>' + MENUS.map(m =>
        `<div class="menu-item" data-key="${m.key}" onclick="renderPage('${m.key}')">${esc(m.label)}${m.done ? '<span class="tag">●</span>' : ""}</div>`
    ).join("");
}

function renderPage(key) {
    if (key !== "ingestion") stopJobTracking();
    document.querySelectorAll(".menu-item").forEach(el =>
        el.classList.toggle("active", el.getAttribute("data-key") === key));
    const menu = MENUS.find(m => m.key === key);
    const content = document.getElementById("pageContent");
    if (!menu) return;
    if (key === "welcome") { renderWelcome(content); return; }
    if (key === "cleaning") { renderCleaning(content); return; }
    if (key === "ingestion") { renderIngestion(content); return; }
    if (key === "sentiment") { renderSentiment(content); return; }
    if (key === "rfm") { renderRfm(content); return; }
    if (key === "forecast") { renderForecast(content); return; }
    if (key === "spatial") { renderSpatial(content); return; }
    if (key === "recommend") { renderRecommend(content); return; }
    if (key === "apimonitor") { renderApiMonitor(content); return; }
    if (key === "dashboard") { renderDashboard(content); return; }
    if (key === "settings") { renderSysSettings(content); return; }
    content.innerHTML = `
        <div class="panel">
            <h2>${esc(menu.label)}</h2>
            <div class="sub">该模块已规划，界面正在按《用户说明书》逐步接入。</div>
            <div class="placeholder"><div class="big">🚧</div>「${esc(menu.label)}」模块建设中<br>可先使用左侧已点亮的功能完成演示</div>
        </div>`;
}

function renderWelcome(content) {
    const now = new Date().toLocaleString("zh-CN");
    content.innerHTML = `
        <div class="welcome-banner">
            <h1>欢迎回来，${esc(currentUser.username)}</h1>
            <p>当前角色：<b>${esc(ROLE_NAMES[currentUser.role] || currentUser.role)}</b>　|　登录时间：${now}　|　系统版本：V1.0</p>
        </div>
        <div class="panel">
            <h2>演示功能</h2>
            <div class="sub">以下功能已接入后端，可直接体验（其余模块按说明书逐步接入）。</div>
            <div class="row">
                <button class="btn-ghost" onclick="doPing()">连通性测试 ping</button>
                <button class="btn-ghost" onclick="doClean()">启动数据清洗融合</button>
                <button class="btn-ghost" onclick="doListTasks()">查看全部任务列表</button>
            </div>
            <div class="log-box" id="logBox">// 点击上方按钮，结果将显示在这里</div>
        </div>`;
}

function log(text, level) {
    const box = document.getElementById("logBox");
    if (!box) return;
    if (box.dataset.empty !== "1") { box.innerHTML = ""; box.dataset.empty = "1"; }
    const lv = level || "INFO";
    const now = new Date();
    const ts = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
    box.insertAdjacentHTML("beforeend", `<div class="log-line ${lv}"><span class="ts">${ts}</span> [${lv}] ${esc(text)}</div>`);
    box.scrollTop = box.scrollHeight;
}

async function doPing() {
    log("发送 ping ...");
    try {
        const res = await pywebview.api.ping();
        log("pong 正常，响应：" + JSON.stringify(res));
    } catch (e) { log("错误：" + e, "ERROR"); }
}

async function doClean() {
    log("开始派发清洗融合任务 ...");
    try {
        const res = await pywebview.api.run_task(
            "run_task_cleaning_fusion_pipeline_9",
            { pipeline_id: "PIPELINE_UI_001" },
            token
        );
        if (res && res.success) {
            const out = (res.data && res.data.handler_output) || {};
            log(`任务编号 ${out.pipeline_task_identifier || "-"} 执行完成`);
            log(`状态 ${out.task_status || "succeeded"}　记录数 ${out.record_count ?? "-"}　去重 ${out.deduped_record_count ?? "-"}　涉及消费者 ${out.distinct_consumer_count ?? "-"} 人`);
            log(`融合总金额 ¥ ${out.total_amount ?? "-"}　耗时 ${out.elapsed_ms ?? (res.data && res.data.elapsed_ms) ?? "-"} ms`);
            if (out.top_merchants && out.top_merchants.length) {
                log(`头部商户：${out.top_merchants.slice(0, 3).map(m => m.merchant_name).join("、")}`);
            }
        } else {
            log("任务失败：" + (res && res.reason ? res.reason : JSON.stringify(res)), "ERROR");
        }
    } catch (e) { log("错误：" + e, "ERROR"); }
}

async function doListTasks() {
    log("拉取全部任务列表 ...");
    try {
        const res = await pywebview.api.list_tasks();
        const tasks = (res && (res.tasks || res.items || res.list)) || (Array.isArray(res) ? res : []);
        if (!tasks.length) { log("当前任务队列为空"); return; }
        log(`共 ${tasks.length} 条任务，摘要如下：`);
        tasks.slice(0, 8).forEach((t, i) => {
            const name = t.task_name || t.task_identifier || t.identifier || "#" + (i + 1);
            const st = t.task_status || t.status || "-";
            const pct = t.progress_percent != null ? t.progress_percent + "%" : "";
            log(`${i + 1}. ${name}　[${st}] ${pct}`);
        });
        if (tasks.length > 8) log(`……其余 ${tasks.length - 8} 条省略，可在各业务页面查看`);
    } catch (e) { log("错误：" + e, "ERROR"); }
}

function renderCleaning(content) {
    content.innerHTML = `

        <div class="panel">

function cfAppendLog(level, msg) {

    const now = new Date();
    const ts = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0")
        + " " + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
    el.insertAdjacentHTML("beforeend", `<div class="log-line ${level}"><span class="ts">${ts}</span> [${level}] ${esc(msg)}</div>`);
    el.scrollTop = el.scrollHeight;
}

function cleanSrcTgt(t) {
    const k = t.task_kind || "";
    if (k.includes("sentiment")) return { src: "餐饮评论表", tgt: "评论情感标签表" };
    if (k.includes("forecast")) return { src: "餐饮订单表 + 零售交易表", tgt: "消费预测宽表" };
    if (k.includes("rfm")) return { src: "消费记录表 + 用户维表", tgt: "RFM 分层宽表" };
    if (k.includes("review")) return { src: "旅游评论表", tgt: "评论标准表" };
    if (k.includes("retail") || k.includes("fusion")) return { src: "零售交易表 + 门店维表", tgt: "零售融合宽表" };
    return { src: "餐饮订单表", tgt: "清洗后订单宽表" };

async function doRunCleaningTask(id) {
    const t = cfTaskCache.find(x => x.pipeline_task_identifier === id);
    if (!t) { alert("未找到任务"); return; }
    const taskId = cleaningTaskIdFor(t.task_kind || "");
    cfAppendLog("INFO", "调度器分发 " + taskId + "（" + t.task_name + "） …");
    try {
        const payload = taskId === "run_task_cleaning_fusion_pipeline_5"
            ? { pipeline_id: id, pipeline_task_identifier: id, forecast_window_days: 30 }
            : { pipeline_id: id, pipeline_task_identifier: id };
        const res = await pywebview.api.run_task(taskId, payload, token);
        if (res && res.success) {
            cfAppendLog("INFO", "TASK " + id + " " + (t.task_name || "") + " 执行完成：记录=" + (res.aligned_record_count ?? res.record_count ?? "-"));
        } else {
            cfAppendLog("ERROR", "TASK " + id + " 执行失败：" + (res && res.reason ? res.reason : JSON.stringify(res)));
        }
        loadCleaningTasks();
    } catch (e) {
        cfAppendLog("ERROR", "TASK " + id + " 执行异常：" + e);
    }
}

function cleaningTaskIdFor(kind) {
    if (kind === "consumption_forecast_anomaly") return "run_task_cleaning_fusion_pipeline_5";
    if (kind === "sentiment_topic_preparation") return "run_task_cleaning_fusion_pipeline_15";

}

    queued: "排队中·等待前序批次释放解析资源，预计4分钟后开始处理",

    "失败": "失败·请点击查看详情中的错误摘要定位原因",
};

function statusBadge(s, pct) {
    let key = STATUS_TEXT[s] ? s : "queued";
    let text = STATUS_TEXT[key] || s;
    if (s === "processing") {
        const p = Number(pct);
        if (p > 0 && p < 55) { key = "checking"; text = "格式校验"; }
        else { key = "processing"; text = "预处理中"; }
    }
    return `<span class="status-badge ${key}">${text}</span>`;
}

function stageDesc(s, pct) {
    if (s === "processing") {
        const p = Number(pct);
        if (p > 0 && p < 55) return STAGE_DESC.checking;
        return STAGE_DESC.processing;
    }
    return STAGE_DESC[s] || ("状态: " + s);
}

function shortCh(ch) {
    const s = ch || "";
    if (s.includes("旅游")) return "旅游";
    if (s.includes("零售")) return "零售";
    if (s.includes("餐饮")) return "餐饮";
    return s;
}

function pathFor(r) {
    if (r.endpoint_uri) return r.endpoint_uri;
    const ch = r.source_channel || r.source_name || "";
    const key = ch.includes("旅游") ? "tourism" : (ch.includes("零售") ? "retail" : "catering");
    const t = r.created_at ? String(r.created_at) : "";
    const d = (t.match(/\d{4}-\d{2}-\d{2}/) || [""])[0].replace(/-/g, "");
    return "/data/ingest/" + key + "/" + (d || "00000000") + "/";
}

function fmtTime(v) {
    if (!v) return "-";
    const s = String(v);
    if (s.includes("T")) {
        const d = new Date(s);
        if (!isNaN(d.getTime())) return d.toLocaleString("zh-CN", { hour12: false });
    }
    return s;
}

            if (cards) cards.innerHTML = `<div style="color:#b91c1c;font-size:13px;">查询失败：${esc(res && res.reason)}</div>`;
            return;
        }

            if (cards) cards.innerHTML = `<div style="color:#94a3b8;font-size:13px;">暂无导入批次，点击上方「导入」按钮体验</div>`;

function fileExtFor(ch) {
    const s = ch || "";
    if (s.includes("零售")) return "json";
    if (s.includes("旅游")) return "json";
    return "csv";
}
function fileNameFor(r) {
    let recorded = null;
    if (r.payload_json) {
        try { recorded = JSON.parse(r.payload_json); } catch (e) { recorded = null; }
    }
    if (recorded && recorded.file_name) return recorded.file_name;
    const ch = r.source_channel || r.source_name || r.batch_identifier || ("#" + r.id);
    const bid = r.batch_identifier || "";
    const tail = bid.length > 6 ? bid.slice(-6) : bid;
    const ext = (recorded && recorded.file_ext) ? recorded.file_ext : fileExtFor(ch);
    return ch + (tail ? "_" + tail : "") + "." + ext;
}

async function doImport(sourceType, fileExt) {

}

// ---------------- S1 后台任务轮询（真实进度） ----------------
const JOB_STATUS_LABELS = { queued: "排队中", running: "运行中", succeeded: "已完成", failed: "失败", canceled: "已取消" };
let activeJobId = null;
let activeJobTimer = null;
let activeJobSeq = 0;

function stopJobTracking() {
    if (activeJobTimer) { clearInterval(activeJobTimer); activeJobTimer = null; }
    activeJobId = null;
    activeJobSeq = 0;
}

function appendJobLog(line) {
    const box = document.getElementById("jobLog");
    if (!box) return;
    box.textContent += line + "\n";
    box.scrollTop = box.scrollHeight;
}

function renderJobPanel(job) {
    const panel = document.getElementById("jobPanel");
    if (!panel) return;
    panel.style.display = "block";
    const pct = Math.max(0, Math.min(100, Number(job.progress || 0)));
    const title = document.getElementById("jobTitle");
    if (title) title.textContent = "后台任务 " + (job.job_id || "");
    const pctBox = document.getElementById("jobPct");
    if (pctBox) pctBox.textContent = pct + "%";
    const bar = document.getElementById("jobBar");
    if (bar) bar.style.width = pct + "%";
    const meta = document.getElementById("jobMeta");
    if (meta) {
        const status = JOB_STATUS_LABELS[job.status] || job.status || "-";
        const seconds = ((job.elapsed_ms || 0) / 1000).toFixed(1);
        const eta = job.eta_ms > 0 ? ("预计剩余 " + (job.eta_ms / 1000).toFixed(1) + " 秒") : "预计剩余 —";
        meta.textContent = `状态：${status} · 阶段：${job.stage_label || job.stage || "-"} · 已用 ${seconds} 秒 · ${eta} · ${job.message || ""}`;
    }
}

async function renderIngestionResult(job) {
    const box = document.getElementById("jobResult");
    const pre = document.getElementById("jobRows");
    if (!box) return;
    const r = (job && job.result) || {};
    if (r.valid_rows == null) {
        box.style.display = "none";
        if (pre) pre.style.display = "none";
        return;
    }
    box.style.display = "block";
    box.textContent = `本次入库 ${r.valid_rows} 行 · 坏行 ${r.error_rows || 0} · 重复跳过 ${r.duplicate_rows || 0} · 文件 ${r.total_files || 0} 个`;
    const batch = (r.batch_identifiers || [])[0];
    if (!batch || !pre) return;
    try {
        const res = await pywebview.api.list_ingestion_rows(batch, "", 5, 0, token);
        if (!res || !res.success) { pre.style.display = "none"; return; }
        const rows = res.rows || [];
        pre.style.display = "block";
        pre.textContent = `预览 ${batch} 前 ${rows.length} 行（共 ${(res.counts || {}).total || 0} 行）：\n` +
            rows.map(row => `第${row.line_no}行 ${row.parse_status === "ok" ? "好行" : "坏行：" + (row.parse_error || "")} ${JSON.stringify(row.raw).slice(0, 110)}`).join("\n");
    } catch (e) {
        pre.style.display = "none";
    }
}

async function trackIngestionJob(jobId) {
    stopJobTracking();
    activeJobId = jobId;
    activeJobSeq = 0;
    const panel = document.getElementById("jobPanel");
    if (panel) panel.style.display = "block";
    // 清空上一次任务遗留的结果区与行预览，避免两次运行的进度/结果“重叠”
    const resultBox = document.getElementById("jobResult");
    if (resultBox) { resultBox.style.display = "none"; resultBox.textContent = ""; }
    const rowsPre = document.getElementById("jobRows");
    if (rowsPre) { rowsPre.style.display = "none"; rowsPre.textContent = ""; }
    // 进度条、百分比、元信息复位到“排队中”的零点
    const bar = document.getElementById("jobBar");
    if (bar) bar.style.width = "0%";
    const pctBox = document.getElementById("jobPct");
    if (pctBox) pctBox.textContent = "0%";
    const meta = document.getElementById("jobMeta");
    if (meta) meta.textContent = "状态：排队中 · 阶段：- · 已用 0.0 秒 · 预计剩余 —";
    const title = document.getElementById("jobTitle");
    if (title) title.textContent = "后台任务 " + jobId;
    const log = document.getElementById("jobLog");
    if (log) log.textContent = "";
    appendJobLog("[开始] 任务 " + jobId + " 已提交，开始轮询真实进度");

    const poll = async () => {
        if (!activeJobId) return;
        try {
            const res = await pywebview.api.get_job(jobId, activeJobSeq, token);
            if (!res || !res.success) {
                appendJobLog("[错误] " + ((res && res.reason) || "查询失败"));
                stopJobTracking();
                return;
            }
            renderJobPanel(res.job || {});
            (res.events || []).forEach(ev => {
                activeJobSeq = Math.max(activeJobSeq, ev.seq || 0);
                appendJobLog("[" + (ev.level || "INFO") + "] " + (ev.message || ""));
            });
            const status = (res.job || {}).status;
            if (["succeeded", "failed", "canceled"].indexOf(status) >= 0) {
                appendJobLog("[" + status + "] " + ((res.job || {}).message || ""));
                if (status === "succeeded") await renderIngestionResult(res.job || {});
                stopJobTracking();
                loadIngestionAll();
            }
        } catch (e) {
            appendJobLog("[异常] " + e);
            stopJobTracking();
        }
    };
    await poll();
    if (activeJobId === jobId) activeJobTimer = setInterval(poll, 700);
}

// 加载真实热力图数据并渲染 ECharts 地图
function loadSpatialRealData() {
    fetch('heatmap_data.json')
        .then(r => r.json())
        .then(payload => {
            const data = payload.data || [];
            if (!data.length) return;

            // 计算 KPI
            const cityCount = data.length;
            const hotCities = data.filter(d => d.heat_score >= 50).length;
            const avgHeat = (data.reduce((s, d) => s + d.heat_score, 0) / cityCount).toFixed(1);
            const topCity = data.reduce((max, d) => d.heat_score > max.heat_score ? d : max, data[0]);
            const totalRetail = data.reduce((s, d) => s + (d.retail_total_yi || 0), 0).toFixed(0);
            const totalPop = data.reduce((s, d) => s + (d.population_wan || 0), 0).toFixed(1);

            // 更新 KPI 行
            const kpiRow = document.getElementById('spatialKpiRow');
            if (kpiRow) {
                kpiRow.innerHTML = `
                    <div class="kpi"><div class="num">${cityCount} 个</div><div class="lbl">覆盖城市数</div></div>
                    <div class="kpi"><div class="num">${hotCities} 个</div><div class="lbl">热点城市(>50分)</div></div>
                    <div class="kpi"><div class="num warn">${avgHeat}</div><div class="lbl">平均热力指数</div></div>
                    <div class="kpi"><div class="num">${topCity.city} ${topCity.heat_score}</div><div class="lbl">最高热度城市</div></div>
                    <div class="kpi"><div class="num">${totalRetail}</div><div class="lbl">零售总额合计(亿)</div></div>
                    <div class="kpi"><div class="num">${totalPop}</div><div class="lbl">总人口(万)</div></div>
                `;
            }

            // 更新排名
            const sorted = [...data].sort((a, b) => b.heat_score - a.heat_score);
            const rankingEl = document.getElementById('spatialRanking');
            if (rankingEl) {
                rankingEl.innerHTML = `<b>四川省城市消费热力排名（前5）：</b><br>` +
                    sorted.slice(0, 5).map((d, i) =>
                        `${i+1}. ${d.city}　热力值 ${d.heat_score} / 零售 ${d.retail_total_yi}亿`
                    ).join('<br>');
            }

            // 渲染 ECharts 地图（先注册四川 GeoJSON）
            renderSpatialMap(payload.echarts_option);

            // 渲染 ECharts 城市排名条形图
            renderSpatialBar(sorted);

            // 生成基于真实数据的分析结论
            const alertsEl = document.getElementById('spatialAlerts');
            if (alertsEl) {
                alertsEl.innerHTML = generateSpatialInsights(sorted);
            }
        })
        .catch(err => {
            console.error('加载热力图数据失败:', err);
            const alertsEl = document.getElementById('spatialAlerts');
            if (alertsEl) {
                alertsEl.innerHTML = '<div style="padding:20px;color:#b91c1c;">数据加载失败，请检查 heatmap_data.json</div>';
            }
        });
}

// 渲染四川消费热力地图（ECharts geo + heatmap + scatter）
function renderSpatialMap(optionFromBackend) {
    const tip = document.getElementById('spatialMapTip');
    const chartEl = document.getElementById('spatialMapChart');
    if (!chartEl || typeof echarts === 'undefined') return;

    // 从后端 option 里取出原始数据，自己重建兼容 option（heatmap 不支持 geo，改用 scatter）
    const rawSeries = (optionFromBackend && optionFromBackend.series) || [];
    const heatData = (rawSeries.find(s => s.name === '消费热力') || {}).data || [];
    const cityData = (rawSeries.find(s => s.name === '城市标注') || {}).data || [];

    function doRender(geoJson) {
        try {
            echarts.registerMap('sichuan', geoJson);
            const chart = echarts.init(chartEl);
            chart.setOption({
                title: {
                    text: '四川省消费热力地图',
                    subtext: '数据来源：四川省统计公报 + 阿里云DataV地理坐标',
                    left: 'center',
                    textStyle: { color: '#0e7490', fontSize: 16 },
                    subtextStyle: { color: '#64748b', fontSize: 11 },
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function(p) {
                        if (p.seriesType === 'scatter' && p.data && p.data.value) {
                            return `<b>${p.name || '热力点'}</b><br/>热力值: ${p.data.value[2] || '-'}`;
                        }
                        return p.name;
                    },
                },
                geo: {
                    map: 'sichuan',
                    roam: true,
                    zoom: 1.0,
                    label: { show: false },
                    itemStyle: { areaColor: '#f0f9ff', borderColor: '#0e7490', borderWidth: 0.8 },
                    emphasis: { itemStyle: { areaColor: '#cffafe' }, label: { show: true, color: '#0f172a' } },
                },
                visualMap: {
                    min: 0, max: 100, calculable: true,
                    left: 16, bottom: 16,
                    text: ['高', '低'],
                    inRange: { color: ['#e0f3f8', '#abd9e9', '#74add1', '#fdae61', '#d73027'] },
                    textStyle: { color: '#334155' },
                },
                series: [
                    {
                        name: '消费热力',
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        data: heatData.map(d => ({ name: '', value: d })),
                        symbolSize: function(val) { return Math.max(10, (val[2] || 10) / 3); },
                        itemStyle: { opacity: 0.85, shadowBlur: 10, shadowColor: 'rgba(215,48,39,0.5)' },
                    },
                    {
                        name: '城市标注',
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        data: cityData,
                        symbolSize: 6,
                        label: {
                            show: true,
                            formatter: '{b}',
                            position: 'right',
                            color: '#0f172a',
                            fontSize: 11,
                            fontWeight: 'bold',
                        },
                        itemStyle: { color: '#fff', borderColor: '#0e7490', borderWidth: 1.5 },
                        zlevel: 2,
                    },
                ],
            });
            window.addEventListener('resize', () => chart.resize());
            if (tip) tip.textContent = '🗺️ 拖拽平移 / 滚轮缩放，悬浮查看城市热力值';
        } catch (e) {
            if (tip) { tip.style.color = '#b91c1c'; tip.textContent = '地图渲染失败: ' + e.message; }
        }
    }

    fetch('sichuan_geo.json')
        .then(r => { if (!r.ok) throw new Error('no local'); return r.json(); })
        .then(doRender)
        .catch(() => {
            fetch('https://geo.datav.aliyun.com/areas_v3/bound/510000_full.json')
                .then(r => r.json())
                .then(geoJson => {
                    try { localStorage.setItem('sichuan_geo', JSON.stringify(geoJson)); } catch(e){}
                    doRender(geoJson);
                })
                .catch(() => {
                    try {
                        const cached = localStorage.getItem('sichuan_geo');
                        if (cached) return doRender(JSON.parse(cached));
                    } catch(_){}
                    if (tip) { tip.style.color = '#b91c1c'; tip.textContent = '四川地图 GeoJSON 加载失败（需联网或本地 sichuan_geo.json）'; }
                });
        });
}

// 渲染城市热力排名条形图
function renderSpatialBar(sorted) {
    const el = document.getElementById('spatialBarChart');
    if (!el || typeof echarts === 'undefined') return;
    const top10 = sorted.slice(0, 10).reverse();
    const chart = echarts.init(el);
    chart.setOption({
        title: { text: '四川省城市消费热力 TOP10', left: 'center', textStyle: { fontSize: 14, color: '#334155' } },
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: 70, right: 40, top: 40, bottom: 20 },
        xAxis: { type: 'value', max: 100, axisLabel: { color: '#64748b' } },
        yAxis: { type: 'category', data: top10.map(d => d.city), axisLabel: { color: '#334155' } },
        series: [{
            name: '热力值',
            type: 'bar',
            data: top10.map(d => d.heat_score),
            itemStyle: {
                color: function(p) {
                    const v = p.value;
                    if (v >= 80) return '#d73027';
                    if (v >= 60) return '#fdae61';
                    if (v >= 40) return '#fee090';
                    return '#74add1';
                },
                borderRadius: [0, 4, 4, 0],
            },
            label: { show: true, position: 'right', color: '#334155', fontSize: 11 },
        }],
    });
    window.addEventListener('resize', () => chart.resize());
}

                <button class="btn-ghost" style="margin-left:8px;" onclick="openExecModal('系统初始化', '确认执行？将直接启动本地消费分析流程。')">执行任务</button>
            </div>
        </div>
    </div>

    <div class="ing-grid" style="margin-top:16px;">
        <div class="panel">
            <div class="panel-head"><h2>分析参数设置</h2><div class="panel-btns"><button class="btn-ghost" onclick="openExecModal('分析参数设置', '确认保存当前分析参数？')">保存</button></div></div>
            <div class="sub">带 * 号项为必填，调整后需点击保存生效。</div>
            <div class="mini-form two-col">
                <div><label>评论情感正阈值 *</label><input type="number" step="0.01" value="0.65"></div>
                <div><label>评论情感负阈值 *</label><input type="number" step="0.01" value="0.35"></div>
                <div><label>RFM 最近消费窗口（天）*</label><input type="number" value="30"></div>
                <div><label>RFM 高价值阈值金额 *</label><input type="number" value="8"></div>
                <div><label>RFM 高价值客户金额间隔（元）*</label><input type="number" value="2000"></div>
                <div><label>消费预测窗口（天）*</label><input type="number" value="14"></div>
                <div><label>异常检测灵敏度 *</label><select><option>中</option><option>低</option><option>高</option></select></div>
                <div><label>空间热点网格粒度（米）*</label><input type="number" value="500"></div>
                <div><label>个性化推荐返回条数 *</label><input type="number" value="10"></div>
                <div><label>排序策略名称 *</label><select><option>最新</option><option>最热</option><option>综合</option></select></div>
                <div><label>本地数据路径</label><input value="D:/data/local_consumption/"></div>
                <div><label>调度周期表达式</label><input value="0 */5 * * * ?"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-head"><h2>配置帮助说明</h2></div>
            <div class="sub">以下为初始化配置常见问题，点击问题展开对应说明。</div>
            ${faqs.map((f, i) => `
            <div class="faq-item" onclick="this.classList.toggle('open')">
                <div class="faq-q"><span>${f}</span><span style="color:#94a3b8;">▾</span></div>
                <div class="faq-a">该参数建议结合业务场景与数据量选择：${f.replace("？", "")}的推荐取值范围与业务影响已在初始化向导中给出参考；若拿不准可保持默认值，后续在分析过程中再逐步微调。</div>
            </div>`).join("")}
        </div>
    </div>`;
}

/* ---------- 全局拖拽拦截：preventDefault 让 pywebview DOM API 能接管文件路径 ---------- */
document.addEventListener("dragover", function (e) { e.preventDefault(); });
document.addEventListener("drop", function (e) { e.preventDefault(); });

/* ---------- 启动 ---------- */
if (!checkSession()) {
    document.getElementById("loginView").style.display = "flex";
}
</script>
</body>
</html>
